name: Live Loom cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-live-loom-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cleanup
        run: |
          sed -i 's/re.subn(pattern, repl, text, count=1, flags=flags)/re.subn(pattern, lambda m: repl, text, count=1, flags=flags)/' scripts/live_loom_cleanup.py
          python scripts/live_loom_cleanup.py
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          rm scripts/live_loom_cleanup.py .github/workflows/one-time-live-loom-cleanup.yml
          git config user.name walkenhorst-automation
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix: unify CRM and Studio on live Loom workflow"
          git push origin HEAD:main
