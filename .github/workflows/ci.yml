name: Walkenhorst CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: install
        continue-on-error: true
        run: npm install
      - name: Publish install status
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.install.outcome }}
        run: |
          state=$([ "$STATE" = "success" ] && echo success || echo failure)
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$state\",\"context\":\"walkenhorst-ci/install\"}" >/dev/null

      - id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck
      - name: Publish typecheck status
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.typecheck.outcome }}
        run: |
          state=$([ "$STATE" = "success" ] && echo success || echo failure)
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"$state\",\"context\":\"walkenhorst-ci/typecheck\"}" >/dev/null

      - id: nextbuild
        if: steps.install.outcome == 'success' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Publish build status and error signature
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.nextbuild.outcome }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const state = process.env.STATE === 'success' ? 'success' : 'failure';
          const log = fs.existsSync('build.log') ? fs.readFileSync('build.log','utf8') : '';
          const lines = log.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
          const candidate = lines.find(s => /Error:|TypeError:|ReferenceError:|Failed to compile|Build error|prerender|Module not found|Export encountered/i.test(s)) || lines.at(-1) || 'unknown';
          const clean = candidate.replace(/[^a-zA-Z0-9._:/ -]+/g,' ').replace(/\s+/g,' ').slice(0,76);
          const contexts = ['walkenhorst-ci/build'];
          if (state === 'failure') contexts.push(`build-error/${clean}`.slice(0,100));
          (async () => {
            for (const context of contexts) {
              await fetch(`https://api.github.com/repos/${process.env.REPO}/statuses/${process.env.SHA}`, {
                method:'POST',
                headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
                body:JSON.stringify({state,context})
              });
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Fail workflow if verification failed
        if: steps.install.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.nextbuild.outcome != 'success'
        run: exit 1
