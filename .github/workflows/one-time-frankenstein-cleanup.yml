name: One-time Frankenstein cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-frankenstein-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean product flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(); n=text.count(old)
              if n < count: raise SystemExit(f"missing pattern in {path}: {old[:100]} ({n})")
              p.write_text(text.replace(old,new,count))

          def must_regex(path, pattern, repl, flags=0):
              p=Path(path); text=p.read_text(); new,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n != 1: raise SystemExit(f"regex mismatch in {path}: {pattern[:100]} ({n})")
              p.write_text(new)

          # Global shell: Live Loom is canonical, MP4 queue is not a daily concern.
          must_replace('components/application-frame.tsx','import { RenderQueueRunner } from "@/components/crm/render-queue-runner";\n','')
          must_replace('components/application-frame.tsx','        <RenderQueueRunner user={user} />\n','')

          # CRM: one production artifact = personalized Loom.
          p='components/crm/lead-crm.tsx'
          must_replace(p,'const STEPS=["Lead","Enrichment","Landingpage","Video","Entwurf","Prüfung","Versand","Engagement"];',
                         'const STEPS=["Lead","Kontakt","Loom","Mail","Prüfung","Versand","Reaktion","Abschluss"];')
          must_regex(p,r'function stage\(w\?:Workflow\)\{.*?\}function initials',
            'function stage(w?:Workflow){if(!w)return 0;if(w.replied)return 7;if(w.email_sent&&(w.email_opened||w.email_clicked||w.page_viewed||w.video_played||w.cta_clicked))return 6;if(w.email_sent)return 5;if(w.email_reviewed)return 4;if(w.email_draft_ready)return 3;if(w.video_ready)return 2;if(w.enrichment_status||w.contact_count>0)return 1;return 0}function initials')
          must_regex(p,r'function next\(r:Row\)\{.*?\}function watch',
            'function next(r:Row){const w=r.workflow;if(!w?.enrichment_status&&!w?.contact_count)return"Kontakte anreichern";if(!w?.video_ready)return"Persönlichen Loom erstellen";if(!w?.email_draft_ready)return"E-Mail-Entwurf erstellen";if(!w?.email_reviewed)return"Entwurf prüfen & freigeben";if(!w?.email_sent)return"Freigegebene E-Mail senden";if(w.replied)return"Antwort bearbeiten";if(w.cta_clicked||w.video_played&&Number(w.max_watch_percent||0)>=75)return"Jetzt anrufen";return"Reaktion beobachten"}function watch')
          must_regex(p,r'useEffect\(\(\)=>\{const h=\(e:Event\)=>\{const d=.*?\},\[load\]\);\n','',flags=re.S)
          must_replace(p,'const metrics=useMemo(()=>rows.reduce((a,r)=>{a.enrich+=r.workflow?.enrichment_status?0:1;a.lp+=r.workflow?.page_ready?1:0;a.video+=r.workflow?.video_ready?1:0;a.hot+=isHot(r)?1:0;return a},{enrich:0,lp:0,video:0,hot:0}),[rows]);',
                         'const metrics=useMemo(()=>rows.reduce((a,r)=>{a.enrich+=r.workflow?.enrichment_status?0:1;a.video+=r.workflow?.video_ready?1:0;a.sent+=r.workflow?.email_sent?1:0;a.hot+=isHot(r)?1:0;return a},{enrich:0,video:0,sent:0,hot:0}),[rows]);')
          must_regex(p,r' async function bulkAction\(action:"enrich"\|"prepare_page"\|"render"\|"create_draft"\)\{.*?\n async function createLead',
''' async function bulkAction(action:"enrich"|"prepare_page"|"create_draft"){if(!supabase||!selected.size||bulk)return;const ids=[...selected],labels={enrich:"Kontakte",prepare_page:"Persönliche Looms",create_draft:"Entwürfe"};setBulk({label:labels[action],done:0,total:ids.length,failed:0});setError(null);try{let done=0,failed=0;const concurrency=action==="prepare_page"?2:4;for(let i=0;i<ids.length;i+=concurrency){await Promise.all(ids.slice(i,i+concurrency).map(async leadId=>{try{const r=await supabase.functions.invoke("crm-lead-workflow",{body:{action,leadId,baseUrl:window.location.origin,templateKey:studioTemplateKey}});if(r.error||(r.data as any)?.error)throw new Error((r.data as any)?.error||r.error?.message||"Aktion fehlgeschlagen")}catch{failed++}finally{done++;setBulk({label:labels[action],done,total:ids.length,failed})}}))}setNotice(`${labels[action]}: ${done-failed}/${ids.length} erfolgreich${failed?` · ${failed} Blocker`:""}`);await load();window.setTimeout(()=>setBulk(null),1800)}catch(e){setError(e instanceof Error?e.message:"Bulk-Aktion fehlgeschlagen.");setBulk(null)}}
 async function createLead''',flags=re.S)
          must_replace(p,'<section className={styles.kpis}><article><small>Leads</small><strong>{rows.length}</strong></article><article><small>Enrichment offen</small><strong>{metrics.enrich}</strong></article><article><small>Landingpages</small><strong>{metrics.lp}</strong></article><article><small>Videos fertig</small><strong>{metrics.video}</strong></article><article><small>Hot / Signal</small><strong>{metrics.hot}</strong></article></section>',
                         '<section className={styles.kpis}><article><small>Leads</small><strong>{rows.length}</strong></article><article><small>Kontakte offen</small><strong>{metrics.enrich}</strong></article><article><small>Looms bereit</small><strong>{metrics.video}</strong></article><article><small>Versendet</small><strong>{metrics.sent}</strong></article><article><small>Hot / Signal</small><strong>{metrics.hot}</strong></article></section>')
          must_regex(p,r'<div className=\{styles\.bulkButtons\}>.*?</div>\{bulk\?',
            '<div className={styles.bulkButtons}><button disabled={!!bulk} onClick={()=>void bulkAction("enrich")}>Kontakte anreichern</button><button className={styles.primaryBulk} disabled={!!bulk} onClick={()=>void bulkAction("prepare_page")}>Looms erstellen</button><button disabled={!!bulk} onClick={()=>void bulkAction("create_draft")}>Entwürfe erstellen</button><button disabled={!!bulk} onClick={()=>setSelected(new Set())}>Aufheben</button><button disabled={!!bulk} onClick={()=>void deleteSelected()}>Löschen</button></div>{bulk?',flags=re.S)
          must_replace(p,'<td><div className={styles.production}><span className={w?.page_ready?styles.ok:styles.open}>LP {w?.page_ready?"✓":"offen"}</span><span className={w?.video_ready?styles.ok:styles.open}>Video {w?.video_ready?"✓":"offen"}</span></div></td>',
                         '<td><div className={styles.production}><span className={w?.video_ready?styles.ok:styles.open}>Loom {w?.video_ready?"✓ bereit":"offen"}</span></div></td>')
          must_replace(p,'<strong>{w?.workflow_stage_label||"Lead angelegt"}</strong><small>{Math.max(0,Math.min(100,w?.workflow_percent||12))}%</small>',
                         '<strong>{STEPS[s]}</strong><small>{Math.round((s+1)/STEPS.length*100)}%</small>')

          # Lead detail: stop presenting MP4 as the required artifact.
          p='components/lead-detail-workspace.tsx'
          must_replace(p,'type Lead={id:string;user_id:string;company_name:string;', 'type Lead={id:string;user_id:string;customer_type?:"commercial"|"private";video_template_key?:string|null;company_name:string;')
          must_replace(p,'  function openStudio(){if(!lead)return;window.localStorage.setItem("walkenhorst.assistant.studioAction",JSON.stringify({action:"select_lead",leadId:lead.id,mode:"video"}));window.location.assign("/studio")}',
                         '  function openStudio(){if(!lead)return;window.localStorage.setItem("walkenhorst.assistant.studioAction",JSON.stringify({action:"select_lead",leadId:lead.id,mode:"video"}));window.location.assign(lead.customer_type==="private"?"/studio/b2c":"/studio/b2b")}')
          must_regex(p,r'  const renderActive=.*?const enrichmentDone=', '  const enrichmentDone=',flags=re.S)
          must_regex(p,r'const nextButton=!lead\.contact_name&&!enrichmentDone\?.*?;\n\n  return',
            'const nextButton=!lead.contact_name&&!enrichmentDone?{label:"Kontakte anreichern",icon:"search" as const,action:()=>run("enrich","Kontakte wurden angereichert."),disabled:false}:!w?.video_ready?{label:"Persönlichen Loom erstellen",icon:"video" as const,action:()=>run("prepare_page","Persönlicher Loom ist live."),disabled:false}:!w?.email_draft_ready?{label:"E-Mail-Entwurf erstellen",icon:"mail" as const,action:()=>run("create_draft","E-Mail-Entwurf erstellt."),disabled:false}:!w?.email_reviewed?{label:"Prüfen & freigeben",icon:"check" as const,action:()=>run("review_draft","E-Mail wurde geprüft und freigegeben."),disabled:false}:!w?.email_sent?{label:"E-Mail senden",icon:"send" as const,action:sendReviewed,disabled:false}:{label:"Reaktion prüfen",icon:"chart" as const,action:()=>setTab("overview"),disabled:false};\n\n  return',flags=re.S)
          must_replace(p,'<a href="/crm/commercial" className={styles.back}>← Gewerbe CRM</a>', '<a href={lead.customer_type==="private"?"/crm/private":"/crm/commercial"} className={styles.back}>← {lead.customer_type==="private"?"Privatkunden CRM":"Gewerbe CRM"}</a>')
          must_replace(p,'Dieser Lead wurde bereits versendet, obwohl kein fertig gerendertes Video hinterlegt ist. Versand bleibt für neue Leads serverseitig blockiert.', 'Dieser Lead wurde bereits versendet, obwohl kein versandbereiter persönlicher Loom hinterlegt ist. Neue Sendungen werden serverseitig blockiert.')
          must_regex(p,r'<section className=\{`\$\{styles\.card\} \$\{styles\.nextCard\}`\}>.*?</section>\n\n      <section className=\{styles\.twoCol\}>',
            '<section className={`${styles.card} ${styles.nextCard}`}><div className={styles.cardHead}><div><span>Next Best Action</span><h2>{next}</h2><p>Das System lässt nur den nächsten sicheren Prozessschritt zu.</p></div><button className={styles.primary} onClick={nextButton.action} disabled={Boolean(busy)||nextButton.disabled}><Icon name={nextButton.icon}/>{nextButton.label}</button></div><div className={styles.gates}>{gates.map(g=><div key={g.key} className={g.ok?styles.gateOk:styles.gateOff}><i>{g.ok?<Icon name="check"/>:"!"}</i><span>{g.label}</span></div>)}</div></section>\n\n      <section className={styles.twoCol}>',flags=re.S)
          must_regex(p,r'<article className=\{styles\.card\}><div className=\{styles\.cardHead\}><div><span>Produktion</span><h2>Landingpage & Video</h2>.*?</article>\n\n      <article className=\{styles\.card\}><div className=\{styles\.cardHead\}><div><span>Engagement</span>',
'''<article className={styles.card}><div className={styles.cardHead}><div><span>Produktion</span><h2>Persönlicher Loom</h2></div>{pageUrl?<a className={styles.linkButton} href={pageUrl} target="_blank"><Icon name="external"/>Live ansehen</a>:null}</div><div className={styles.production}><div><i className={w?.video_ready?styles.ok:styles.off}><Icon name="video"/></i><div><strong>Website + Andreas + Scroll + CTA</strong><span>{w?.video_ready?`Live · ${flow.page?.duration_seconds||107} Sek.`:"Noch nicht erstellt"}</span></div></div></div><div className={styles.productionActions}>{!w?.video_ready?<button className={styles.accentButton} onClick={()=>void run("prepare_page","Persönlicher Loom ist live.")}><Icon name="video"/>Loom erstellen</button>:<button onClick={()=>void run("prepare_page","Persönlicher Loom wurde aktualisiert.")}><Icon name="refresh"/>Loom aktualisieren</button>}<button onClick={openStudio}><Icon name="edit"/>Studio öffnen</button></div></article>

      <article className={styles.card}><div className={styles.cardHead}><div><span>Engagement</span>''',flags=re.S)
          must_replace(p,'Nach dem finalen Video kann die personalisierte Nachricht erstellt werden.', 'Sobald der persönliche Loom live ist, kann die Nachricht erstellt werden.')

          # Studio: editing/previewing only; remove the duplicate browser-render product surface.
          p='components/studio-v3/studio-v3-editor.tsx'
          must_replace(p,'import { StudioV3RenderPanel } from "./studio-v3-render-panel";\n','')
          must_replace(p,'type Mode="video"|"landing"|"brand"|"versions"|"render";', 'type Mode="video"|"landing"|"brand"|"versions";')
          must_replace(p,'const MEDIA_BUCKET="energy-media",MAX_UPLOAD=50*1024*1024;', 'const MEDIA_BUCKET="energy-media",MAX_UPLOAD=50*1024*1024;')
          must_replace(p,'const[project,setProjectState]=useState<ProjectState>(()=>({...defaultStudioV3Project(),bindings:{}}));', 'const[project,setProjectState]=useState<ProjectState>(()=>({...defaultStudioV3Project(defaultTemplateKey),bindings:{}}));')
          must_replace(p,"([['video','Video Editor'],['landing','Landingpage'],['brand','Brand Kit'],['versions','Versionen'],['render','Render']] as const)", "([['video','Video Editor'],['landing','Landingpage'],['brand','Brand Kit'],['versions','Versionen']] as const)")
          must_regex(p,r' \{mode==="render"\?<StudioV3RenderPanel.*?</div>\}\n\nfunction brandToDb', ' </div>}\n\nfunction brandToDb',flags=re.S)

          # Capture reliability: keep full HD but cap pathological long pages and skip embedded video payloads.
          p='lib/studio-website-capture.ts'
          must_replace(p,'const MAX_HEIGHT=18000;', 'const MAX_HEIGHT=10000;')
          must_replace(p,'page.on("request",async request=>{try{const requestUrl=new URL(request.url());', 'page.on("request",async request=>{try{if(request.resourceType()==="media"){await request.abort("blockedbyclient");return}const requestUrl=new URL(request.url());')
          must_replace(p,'const image=await page.screenshot({type:"webp",quality:94,clip:{x:0,y:0,width:WIDTH,height},captureBeyondViewport:true,optimizeForSpeed:false});', 'const image=await page.screenshot({type:"webp",quality:88,clip:{x:0,y:0,width:WIDTH,height},captureBeyondViewport:true,optimizeForSpeed:true});')

          # Campaign emails: show the Loom as a real clickable visual preview, not a naked URL.
          p='supabase/functions/campaign-worker/index.ts'
          must_regex(p,r'function toHtml\(text: string, base: string, token: string\) \{.*?\n\}\n\nfunction timeToMinutes',
'''function toHtml(text: string, base: string, token: string, video?: { url?: string; thumbnailUrl?: string } | null) {
  const track = (url: string) => `${base}/api/t/c/${token}?url=${encodeURIComponent(url)}`;
  let linked = escapeHtml(text)
    .replace(/https?:\\/\\/[^\\s&lt;&gt;]+/g, (url) => `<a href="${track(url)}" style="color:#0a5bd7;text-decoration:underline">${url}</a>`)
    .replace(/\\n/g, "<br>");
  const videoUrl = String(video?.url || "");
  if (videoUrl) {
    const linkedUrl = `<a href="${track(videoUrl)}" style="color:#0a5bd7;text-decoration:underline">${videoUrl}</a>`;
    const thumb = String(video?.thumbnailUrl || "");
    const card = `<div style="margin:18px 0 20px;max-width:560px"><a href="${track(videoUrl)}" style="display:block;text-decoration:none;color:#111">${thumb ? `<img src="${thumb}" width="560" alt="Persönliche Videoanalyse ansehen" style="display:block;width:100%;max-width:560px;height:auto;border:1px solid #e5e7eb;border-radius:14px 14px 0 0">` : ""}<span style="display:block;padding:13px 16px;background:#0b2033;color:#fff;border-radius:${thumb ? "0 0 14px 14px" : "14px"};font-family:Arial,sans-serif;font-size:15px;font-weight:700;text-align:center">▶ Persönliche Videoanalyse ansehen</span></a></div>`;
    linked = linked.replace(linkedUrl, card);
  }
  return `<div style="font-family:Arial,sans-serif;font-size:15px;line-height:1.6;color:#151515">${linked}<br><br><span style="font-size:11px;color:#888">Kein Interesse? <a href="${base}/u/${token}">Abmelden</a></span><img src="${base}/api/t/o/${token}" width="1" height="1" alt="" style="display:none"></div>`;
}

function timeToMinutes''',flags=re.S)
          must_replace(p,'.select("id,slug,rendered_video_url,rendered_video_format,rendered_at,studio_revision,status,timeline_v3,website_capture_url,website_capture_status,website_capture_verified_at,website_capture_width,website_capture_height,website_capture_error,presenter_video_url")', '.select("id,slug,rendered_video_url,rendered_video_format,rendered_at,studio_revision,status,timeline_v3,website_capture_url,thumbnail_url,website_capture_status,website_capture_verified_at,website_capture_width,website_capture_height,website_capture_error,presenter_video_url")')
          must_replace(p,'    captureHeight: capture.height,\n  };', '    captureHeight: capture.height,\n    thumbnailUrl: String(p.thumbnail_url || p.website_capture_url || ""),\n  };')
          must_replace(p,'          website_capture_height: video?.captureHeight || null,\n          variant_id:', '          website_capture_height: video?.captureHeight || null,\n          thumbnail_url: video?.thumbnailUrl || null,\n          variant_id:')
          must_replace(p,'  const html = toHtml(text, base, message.tracking_token);', '  const html = toHtml(text, base, message.tracking_token, video);')

          # One-time workflow deletes itself after a successful build.
          Path('.github/workflows/one-time-frankenstein-cleanup.yml').unlink()
          PY
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit cleanup
        run: |
          git config user.name "walkenhorst-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: unify CRM and Studio on live Loom workflow"
          git push origin HEAD:main
