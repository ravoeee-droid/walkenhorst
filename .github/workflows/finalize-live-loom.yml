name: Finalize Live Loom

on:
  push:
    branches: ["feature/walkenhorst-final-hold"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: run one-time live Loom finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/walkenhorst-final-hold
          fetch-depth: 0
      - name: Patch canonical Live Loom path and E2E contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          landing = Path('components/video-landing.tsx')
          s = landing.read_text()
          pattern = re.compile(r'const isEnergiekosten=page\.template_key==="energiekosten";const video=.*?;const findings=', re.S)
          replacement = '''const isEnergiekosten=page.template_key==="energiekosten";const video=timeline?<StudioV3PublicPlayer timeline={timeline} brand={brand} variables={variables} resolveSource={item=>item.sourceUrl||null} thumbnailWebsiteUrl={page.website_capture_url} thumbnailPresenterUrl={page.presenter_video_url} onPlaybackStart={()=>void playbackStart()} onProgress={mark=>void progress(mark)}/>:page.rendered_video_url?<RenderedVideo url={page.rendered_video_url} brand={brand} onStart={()=>void playbackStart()} onProgress={mark=>void progress(mark)}/>:isEnergiekosten?<RenderPending/>:<LegacyVideo page={page} onStart={()=>void playbackStart()} onProgress={mark=>void progress(mark)}/>;const findings='''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'video selection patch failed: {count}')
          s = s.replace('page.rendered_video_url?"Final gerendert":"Finalisierung"', 'timeline?"Live Loom":page.rendered_video_url?"MP4 Fallback":"Vorbereitung"')
          s = s.replace('Persönliche Videoanalyse wird finalisiert', 'Persönlicher Loom wird vorbereitet')
          s = s.replace('Dieser Link zeigt erst das vollständig gerenderte MP4 – keine Live-Zusammensetzung.', 'Dieser persönliche Link wird automatisch freigeschaltet, sobald die Videoanalyse vollständig vorbereitet ist.')
          landing.write_text(s)

          tests = Path('tests/e2e/outbound-release.spec.ts')
          t = tests.read_text()
          t = t.replace('rendered_video_url: "https://cdn.example.test/final.mp4",', 'rendered_video_url: null,')
          t = t.replace('timeline_v3: null,', '''timeline_v3: {
    version: 3,
    durationMs: 107000,
    fps: 30,
    aspectRatio: "16:9",
    width: 1920,
    height: 1080,
    backgroundColor: "#07192a",
    tracks: [{ id: "track-bg", name: "Website", type: "background", zIndex: 10, locked: false, hidden: false, items: [] }],
  },''', 1)

          def replace_test(source: str, name: str, block: str) -> str:
              start = source.index(f'test("{name}"')
              nxt = source.find('\ntest("', start + 6)
              end = len(source) if nxt < 0 else nxt + 1
              return source[:start] + block.rstrip() + '\n\n' + source[end:]

          t = replace_test(t, 'bulk checkbox, enrichment and landingpage actions work', r'''test("bulk actions use canonical contact and Loom workflow", async ({ page }) => {
  const actions = await mockSupabase(page);
  await openProtected(page, "/crm/commercial");
  const boxes = page.getByRole("checkbox");
  await boxes.nth(1).check();
  await expect(page.getByText("1 ausgewählt", { exact: true })).toBeVisible();
  await page.getByRole("button", { name: "Kontakte anreichern", exact: true }).click();
  await expect.poll(() => actions.some((x) => x.endpoint === "crm-lead-workflow" && x.body.action === "enrich")).toBeTruthy();
  await page.waitForTimeout(2000);
  await page.getByRole("button", { name: "Looms erstellen", exact: true }).click();
  await expect.poll(() => actions.some((x) => x.endpoint === "crm-lead-workflow" && x.body.action === "prepare_page" && x.body.templateKey === "energiekosten")).toBeTruthy();
  await expect(page).toHaveURL(/\/crm\/commercial$/);
});''')

          t = replace_test(t, 'render bulk queues a job without navigating to Studio', r'''test("bulk draft creation stays in the canonical CRM workflow", async ({ page }) => {
  const actions = await mockSupabase(page);
  await openProtected(page, "/crm/commercial");
  await page.getByRole("checkbox").nth(1).check();
  await page.getByRole("button", { name: "Entwürfe erstellen", exact: true }).click();
  await expect.poll(() => actions.some((x) => x.endpoint === "crm-lead-workflow" && x.body.action === "create_draft")).toBeTruthy();
  await expect(page).toHaveURL(/\/crm\/commercial$/);
});''')

          t = replace_test(t, 'public landing page uses completed rendered MP4', r'''test("public Loom page uses Live Timeline V3 without requiring MP4", async ({ page }) => {
  await mockSupabase(page);
  await page.goto("/v/qa-walkenhorst");
  await expect(page.getByText("QA Solarwerke GmbH", { exact: true }).first()).toBeVisible();
  await expect(page.locator("[data-studio-v3-public-player]")).toBeVisible();
  await expect(page.locator('video[src="https://cdn.example.test/final.mp4"]')).toHaveCount(0);
});''')

          t = replace_test(t, 'mail send stays blocked until rendered video exists', r'''test("mail send stays blocked until a personal Loom exists", async ({ page }) => {
  const blockedWorkflow = { ...workflowReady, video_ready: false, rendered_video_url: null, workflow_stage: 2, workflow_stage_label: "Loom", workflow_percent: 38 };
  await mockSupabase(page, {
    workflow: blockedWorkflow,
    page: { id: PAGE_ID, slug: "qa-walkenhorst", status: "published", is_public: true, rendered_video_url: null, rendered_at: null, template_key: "energiekosten", timeline_v3: null, duration_seconds: 107, updated_at: "2026-08-27T10:10:00.000Z" },
    gates: { checks: [{ key: "video", label: "Persönlicher Loom bereit", ok: false }], allPassed: false, sendPassed: false },
  });
  await openProtected(page, `/leads/${LEAD_ID}`);
  const send = page.getByRole("button", { name: "E-Mail senden", exact: true });
  await expect(send).toBeVisible();
  await expect(send).toBeDisabled();
});''')
          tests.write_text(t)

          # This workflow is intentionally one-shot; remove it in the resulting commit.
          Path('.github/workflows/finalize-live-loom.yml').unlink()
          PY
      - name: Verify legacy release-contract strings are gone
        run: |
          ! grep -nE 'Videos rendern|LP erstellen|finale MP4-Videos|mail send stays blocked until rendered video exists|public landing page uses completed rendered MP4' tests/e2e/outbound-release.spec.ts components/video-landing.tsx supabase/functions/campaign-admin/index.ts
      - name: Commit finalized hold branch
        run: |
          git config user.name "walkenhorst-automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/video-landing.tsx tests/e2e/outbound-release.spec.ts .github/workflows/finalize-live-loom.yml
          git commit -m "fix: make Live Timeline V3 the canonical public Loom"
          git push origin HEAD:feature/walkenhorst-final-hold
