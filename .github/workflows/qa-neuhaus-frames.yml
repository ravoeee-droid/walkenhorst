name: QA NEUHAUS Final Frames

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-neuhaus-frames.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium QA runtime
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Capture customer-visible final video frames
        run: |
          rm -rf qa/neuhaus-rev92
          mkdir -p qa/neuhaus-rev92
          cat > .qa-neuhaus-frames.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url='https://walkenhorst.vercel.app/v/neuhaus-neotec-maschinen-und-anlagenbau-gmbh-a3cf0c';
          const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
          const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const page=await context.newPage();
          const log=[];
          page.on('console',m=>log.push(`console:${m.type()}: ${m.text()}`));
          page.on('pageerror',e=>log.push(`pageerror: ${e.message}`));
          try {
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            log.push(`http=${response?.status()}`);
            const video=page.locator('video').first();
            await video.waitFor({state:'visible',timeout:60000});
            await page.waitForFunction(()=>{const v=document.querySelector('video');return v && Number.isFinite(v.duration) && v.duration>20;},undefined,{timeout:60000});
            const meta=await video.evaluate(v=>({src:v.currentSrc||v.src,duration:v.duration,videoWidth:v.videoWidth,videoHeight:v.videoHeight,readyState:v.readyState}));
            fs.writeFileSync('qa/neuhaus-rev92/player-meta.json',JSON.stringify(meta,null,2));
            for (const t of [1,8,15,22]) {
              await video.evaluate(async(v,t)=>{
                v.muted=true;
                v.pause();
                if(Math.abs(v.currentTime-t)<0.01) return;
                await new Promise((resolve,reject)=>{
                  const timer=setTimeout(()=>reject(new Error(`seek ${t}s timeout`)),15000);
                  const finish=()=>{clearTimeout(timer);resolve();};
                  v.addEventListener('seeked',finish,{once:true});
                  v.currentTime=t;
                });
                await new Promise(r=>setTimeout(r,400));
              },t);
              const png=`/tmp/frame-${String(t).padStart(2,'0')}.png`;
              await video.screenshot({path:png});
              const bytes=fs.readFileSync(png);
              fs.writeFileSync(`qa/neuhaus-rev92/frame-${String(t).padStart(2,'0')}.png.b64`,bytes.toString('base64'));
              log.push(`frame_${t}_bytes=${bytes.length}`);
            }
          } catch(e) {
            log.push(`fatal=${e?.stack||e}`);
            process.exitCode=1;
          } finally {
            fs.writeFileSync('qa/neuhaus-rev92/qa.log',log.join('\n'));
            await browser.close();
          }
          EOF
          node .qa-neuhaus-frames.mjs > qa/neuhaus-rev92/node.log 2>&1 || true
          rm -f .qa-neuhaus-frames.mjs
      - name: Commit QA evidence
        run: |
          git config user.name 'walkenhorst-video-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add qa/neuhaus-rev92
          git commit -m 'qa(video): store Chromium-visible NEUHAUS frames' || exit 0
          git push
