name: QA NEUHAUS Final Frames

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-neuhaus-frames.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract final MP4 frames
        shell: bash
        run: |
          set +e
          mkdir -p qa/neuhaus-rev92
          LOG='qa/neuhaus-rev92/qa.log'
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          URL='https://jiahshldcusphxtbqxpv.supabase.co/storage/v1/object/public/energy-media/1b6c9d54-48c7-4bda-bac0-5ede3c71e197/renders/7fb8ce58-3928-4ab4-8f28-16513c4ea114/fa5810f8-4dcc-4405-864e-35746a0c8e38.mp4'
          echo 'Downloading final MP4...'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 "$URL" -o /tmp/final.mp4
          echo "curl_rc=$?"
          ls -lh /tmp/final.mp4 || true
          command -v ffmpeg || true
          command -v ffprobe || true
          for T in 1 8 15 22; do
            OUT="/tmp/frame-${T}.png"
            ffmpeg -y -hide_banner -loglevel error -ss "$T" -i /tmp/final.mp4 -frames:v 1 "$OUT"
            RC=$?
            echo "ffmpeg_${T}_rc=$RC"
            if [ "$RC" -eq 0 ] && [ -s "$OUT" ]; then
              base64 -w0 "$OUT" > "qa/neuhaus-rev92/frame-${T}.png.b64"
              echo "frame_${T}_bytes=$(stat -c%s "$OUT")"
            fi
          done
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,bit_rate -show_entries format=duration,size,bit_rate -of json /tmp/final.mp4 > qa/neuhaus-rev92/ffprobe.json 2>>"$LOG"
          echo "ffprobe_rc=$?"
          exit 0
      - name: Commit QA evidence
        run: |
          git config user.name 'walkenhorst-video-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add qa/neuhaus-rev92
          git commit -m 'qa(video): store NEUHAUS final frame evidence' || exit 0
          git push
