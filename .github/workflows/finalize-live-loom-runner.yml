name: Execute Live Loom Finalizer

on:
  push:
    branches: ["feature/walkenhorst-final-hold"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/walkenhorst-final-hold
          fetch-depth: 0
      - name: Execute patch payload
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/finalize-live-loom.yml').read_text()
          payload = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          payload = "\n".join(line[10:] if line.startswith("          ") else line for line in payload.splitlines())
          exec(compile(payload, 'live-loom-finalizer', 'exec'))
          Path('.github/workflows/finalize-live-loom-runner.yml').unlink()
          Path('.github/loom-finalizer.trigger').unlink(missing_ok=True)
          PY
      - name: Verify legacy contract strings are gone
        run: |
          ! grep -nE 'Videos rendern|LP erstellen|finale MP4-Videos|mail send stays blocked until rendered video exists|public landing page uses completed rendered MP4' tests/e2e/outbound-release.spec.ts components/video-landing.tsx supabase/functions/campaign-admin/index.ts
      - name: Commit finalized branch
        run: |
          git config user.name "walkenhorst-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Live Timeline V3 the canonical public Loom"
          git push origin HEAD:feature/walkenhorst-final-hold
