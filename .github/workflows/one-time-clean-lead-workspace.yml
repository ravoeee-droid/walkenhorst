name: Clean lead workspace
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-clean-lead-workspace.yml]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/clean_lead_workspace.py
      - run: |
          npm ci
          npm run typecheck
          npm run build
      - run: |
          rm scripts/clean_lead_workspace.py .github/workflows/one-time-clean-lead-workspace.yml
          git config user.name walkenhorst-automation
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix: remove legacy MP4 state from lead workspace"
          git push origin HEAD:main
